<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HairAR Studio</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root{
    --bg:#0d0b10; --panel:#17141d; --panel2:#1f1b28; --border:#2c2738;
    --accent:#c9a45c; --accent2:#e7c98a; --text:#f2eee6; --muted:#9b93a8;
    --danger:#e05c5c; --ok:#5cc98a; --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
    min-height:100vh; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--border);}
  .logo{font-size:20px; font-weight:700; letter-spacing:.5px;}
  .logo span{color:var(--accent);}
  .langs{display:flex; gap:6px;}
  .langs button{background:var(--panel); color:var(--muted); border:1px solid var(--border);
    border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer;}
  .langs button.on{color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:700;}
  .tabs{display:flex; gap:8px; padding:12px 18px 0;}
  .tabs button{flex:1; padding:12px; font-size:15px; font-weight:600; cursor:pointer;
    background:var(--panel); color:var(--muted); border:1px solid var(--border);
    border-radius:var(--radius) var(--radius) 0 0; border-bottom:none;}
  .tabs button.on{background:var(--panel2); color:var(--accent2);}
  main{flex:1; padding:0 18px 24px; max-width:760px; width:100%; margin:0 auto;}
  .panel{background:var(--panel2); border:1px solid var(--border); border-radius:0 0 var(--radius) var(--radius);
    padding:16px; display:none;}
  .panel.on{display:block;}
  .stage{position:relative; width:100%; aspect-ratio:3/4; background:#000;
    border-radius:var(--radius); overflow:hidden; display:flex; align-items:center; justify-content:center;}
  .stage canvas,.stage img,.stage video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .stage .msg{position:absolute; inset:0; display:flex; flex-direction:column; gap:10px;
    align-items:center; justify-content:center; text-align:center; padding:20px;
    color:var(--muted); font-size:14px; background:rgba(13,11,16,.75); z-index:5;}
  .spinner{width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  h3{margin:18px 0 10px; font-size:13px; font-weight:600; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px;}
  .swatches{display:flex; flex-wrap:wrap; gap:10px;}
  .sw{width:42px; height:42px; border-radius:50%; cursor:pointer; border:3px solid transparent;
    box-shadow:0 2px 6px rgba(0,0,0,.5);}
  .sw.on{border-color:var(--accent2); transform:scale(1.12);}
  .sw.none{background:repeating-linear-gradient(45deg,#333 0 6px,#222 6px 12px);
    display:flex; align-items:center; justify-content:center; color:#aaa; font-size:18px;}
  .sliderRow{display:flex; align-items:center; gap:12px; margin:10px 0;}
  .sliderRow label{font-size:13px; color:var(--muted); width:90px; flex-shrink:0;}
  input[type=range]{flex:1; accent-color:var(--accent);}
  .btnRow{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .btn{flex:1; min-width:120px; padding:13px 16px; border-radius:12px; font-size:15px; font-weight:700;
    cursor:pointer; border:1px solid var(--border); background:var(--panel); color:var(--text);}
  .btn.primary{background:linear-gradient(135deg,var(--accent),#a8843e); color:#181206; border:none;}
  .btn.primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn.ghost{background:transparent;}
  .styleGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(105px,1fr)); gap:10px;}
  .styleCard{background:var(--panel); border:2px solid var(--border); border-radius:12px;
    padding:6px; text-align:center; cursor:pointer; overflow:hidden;}
  .styleCard img{width:100%; height:110px; object-fit:cover; border-radius:8px; display:block; background:#111;}
  .styleCard .nm{font-size:12px; margin-top:6px; color:var(--text);}
  .styleCard.on{border-color:var(--accent); background:#2a2336;}
  .gToggle{display:flex; gap:8px; margin:4px 0 12px;}
  .gToggle button{flex:1; padding:10px; border-radius:10px; background:var(--panel); color:var(--muted);
    border:1px solid var(--border); font-weight:700; font-size:14px; cursor:pointer;}
  .gToggle button.on{background:var(--accent); color:var(--bg); border-color:var(--accent);}
  .note{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
  .keyBar{display:flex; gap:8px; margin-top:8px;}
  .keyBar input{flex:1; background:var(--panel); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:13px;}
  .err{color:var(--danger); font-size:13px; margin-top:8px; display:none; white-space:pre-wrap;}
  .okMsg{color:var(--ok); font-size:13px; margin-top:8px; display:none;}
  /* before/after compare */
  .compare{position:relative; width:100%; aspect-ratio:3/4; border-radius:var(--radius);
    overflow:hidden; display:none; margin-top:14px; background:#000;}
  .compare img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none;}
  .compare .topImg{clip-path:inset(0 50% 0 0);}
  .compare .divider{position:absolute; top:0; bottom:0; left:50%; width:3px; background:var(--accent2);
    pointer-events:none; box-shadow:0 0 8px rgba(0,0,0,.8);}
  .compare input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:ew-resize; margin:0;}
  .tag{position:absolute; top:10px; padding:4px 10px; border-radius:8px; font-size:11px; font-weight:700;
    background:rgba(0,0,0,.6); color:#fff; pointer-events:none;}
  .tag.l{left:10px;} .tag.r{right:10px;}
  footer{text-align:center; font-size:11px; color:var(--muted); padding:10px 0 22px;}
</style>
</head>
<body>
<header>
  <div class="logo">💇 Hair<span>AR</span> Studio</div>
  <div class="langs">
    <button data-lang="en">EN</button>
    <button data-lang="zh-Hant" class="on">繁</button>
    <button data-lang="zh-Hans">简</button>
  </div>
</header>

<div class="tabs" style="max-width:760px;margin:0 auto;width:100%;">
  <button id="tab3dBtn" class="on" data-i18n="tab3d"></button>
  <button id="tabRtBtn" data-i18n="tabRT"></button>
  <!-- temporarily hidden: live color + AI photo tabs -->
  <button id="tabLiveBtn" data-i18n="tabLive" style="display:none;"></button>
  <button id="tabAiBtn" data-i18n="tabAI" style="display:none;"></button>
</div>

<main>
  <!-- ===================== 3D AR HAIRSTYLE TAB (FaceLandmarker + Three.js) ===================== -->
  <section id="d3Panel" class="panel on">
    <div class="stage" id="d3Stage">
      <video id="d3Video" autoplay playsinline muted style="transform:scaleX(-1);"></video>
      <canvas id="d3Canvas" style="transform:scaleX(-1);background:transparent;"></canvas>
      <div class="msg" id="d3Msg"><div class="spinner"></div><div id="d3MsgText" data-i18n="d3Loading"></div></div>
    </div>

    <h3 data-i18n="styleTitle"></h3>
    <div class="styleGrid" id="d3StyleGrid"></div>
    <div class="btnRow">
      <button class="btn" id="d3LoadBtn" data-i18n="d3LoadGltf"></button>
      <input type="file" id="d3File" accept=".glb,.gltf" style="display:none;">
    </div>

    <h3 data-i18n="colorTitle"></h3>
    <div class="swatches" id="d3Swatches"></div>

    <h3 data-i18n="d3Fit"></h3>
    <div class="sliderRow"><label data-i18n="d3Size"></label>
      <input type="range" id="d3Scale" min="60" max="180" value="100"></div>
    <div class="sliderRow"><label data-i18n="d3Height"></label>
      <input type="range" id="d3OffY" min="-60" max="60" value="0"></div>
    <div class="sliderRow"><label data-i18n="d3Depth"></label>
      <input type="range" id="d3OffZ" min="-60" max="60" value="0"></div>

    <div class="note" data-i18n="d3Note"></div>
  </section>

  <!-- ===================== REALTIME AR HAIRSTYLE TAB (Decart Lucy 2.1) ===================== -->
  <section id="rtPanel" class="panel">
    <div class="stage" style="aspect-ratio:16/9;">
      <video id="rtRemote" autoplay playsinline muted style="transform:scaleX(-1);"></video>
      <video id="rtLocal" autoplay playsinline muted
        style="left:auto;top:auto;right:10px;bottom:10px;width:28%;height:auto;aspect-ratio:16/9;
        border-radius:10px;border:2px solid var(--border);transform:scaleX(-1);z-index:4;"></video>
      <div class="msg" id="rtMsg"><div id="rtMsgText" data-i18n="rtIdle"></div></div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
      <div id="rtDot" style="width:10px;height:10px;border-radius:50%;background:#666;"></div>
      <div id="rtStatus" style="font-size:13px;color:var(--muted);" data-i18n="rtIdle"></div>
    </div>
    <div class="btnRow">
      <button class="btn primary" id="rtConnectBtn" data-i18n="rtConnect"></button>
      <button class="btn" id="rtDisconnectBtn" data-i18n="rtDisconnect" style="display:none;"></button>
    </div>

    <h3 data-i18n="rtModeTitle"></h3>
    <div class="gToggle">
      <button id="rtMode21Btn" class="on" data-i18n="rtMode21"></button>
      <button id="rtModeVtonBtn" data-i18n="rtModeVton"></button>
    </div>
    <div class="note" data-i18n="rtModeHint"></div>

    <h3 data-i18n="styleTitle"></h3>
    <div class="gToggle">
      <button id="rtGenF" data-i18n="genderF"></button>
      <button id="rtGenM" data-i18n="genderM"></button>
    </div>
    <div class="styleGrid" id="rtStyleGrid"></div>

    <h3 data-i18n="rtRefTitle"></h3>
    <div class="note" data-i18n="rtRefDesc"></div>
    <div style="display:flex;align-items:center;gap:12px;margin-top:10px;">
      <button class="btn" style="flex:0 0 auto;" id="rtRefBtn" data-i18n="rtRefUpload"></button>
      <img id="rtRefThumb" style="display:none;width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid var(--accent);">
      <button class="btn ghost" style="flex:0 0 auto;display:none;" id="rtRefClearBtn" data-i18n="rtRefClear"></button>
      <input type="file" id="rtRefInput" accept="image/jpeg,image/png,image/webp" style="display:none;">
    </div>

    <h3 data-i18n="colorTitleAI"></h3>
    <div class="swatches" id="rtSwatches"></div>

    <h3 data-i18n="rtKeyTitle"></h3>
    <div class="note" data-i18n="rtKeyDesc"></div>
    <div class="keyBar">
      <input type="password" id="rtApiKey" placeholder="Decart API key...">
      <button class="btn" style="flex:0;" id="rtSaveKeyBtn" data-i18n="save"></button>
    </div>
    <div class="okMsg" id="rtKeySaved" data-i18n="keySaved"></div>
    <div class="err" id="rtErr"></div>
    <div class="note" data-i18n="rtNote"></div>
  </section>

  <!-- ===================== LIVE COLOR TAB ===================== -->
  <section id="livePanel" class="panel">
    <div class="stage">
      <video id="video" autoplay playsinline muted style="display:none;"></video>
      <canvas id="liveCanvas"></canvas>
      <div class="msg" id="liveMsg"><div class="spinner"></div><div data-i18n="loadingModel"></div></div>
    </div>
    <h3 data-i18n="colorTitle"></h3>
    <div class="swatches" id="liveSwatches"></div>
    <div style="margin-top:14px;">
      <div class="sliderRow"><label data-i18n="strength"></label>
        <input type="range" id="strength" min="0" max="100" value="75"></div>
      <div class="sliderRow"><label data-i18n="brightness"></label>
        <input type="range" id="brightness" min="40" max="260" value="110"></div>
    </div>
    <div class="btnRow">
      <button class="btn primary" id="snapBtn" data-i18n="snapshot"></button>
    </div>
    <div class="note" data-i18n="liveNote"></div>
  </section>

  <!-- ===================== AI HAIRSTYLE TAB ===================== -->
  <section id="aiPanel" class="panel">
    <div class="stage" id="aiStage">
      <canvas id="aiPreviewCanvas"></canvas>
      <img id="aiPhoto" style="display:none;">
      <div class="msg" id="aiMsg" style="display:none;"><div class="spinner"></div><div id="aiMsgText"></div></div>
    </div>
    <div class="btnRow">
      <button class="btn" id="takePhotoBtn" data-i18n="takePhoto"></button>
      <button class="btn ghost" id="uploadBtn" data-i18n="upload"></button>
      <button class="btn ghost" id="retakeBtn" data-i18n="retake" style="display:none;"></button>
      <input type="file" id="fileInput" accept="image/*" style="display:none;">
    </div>

    <h3 data-i18n="styleTitle"></h3>
    <div class="gToggle">
      <button id="aiGenF" data-i18n="genderF"></button>
      <button id="aiGenM" data-i18n="genderM"></button>
    </div>
    <div class="styleGrid" id="styleGrid"></div>

    <h3 data-i18n="colorTitleAI"></h3>
    <div class="swatches" id="aiSwatches"></div>

    <h3 data-i18n="apiKeyTitle"></h3>
    <div class="note" data-i18n="apiKeyDesc"></div>
    <div class="keyBar">
      <input type="password" id="apiKey" placeholder="AIza...">
      <button class="btn" style="flex:0;" id="saveKeyBtn" data-i18n="save"></button>
    </div>
    <div class="okMsg" id="keySaved" data-i18n="keySaved"></div>

    <div class="btnRow">
      <button class="btn primary" id="genBtn" data-i18n="generate" disabled></button>
    </div>
    <div class="err" id="aiErr"></div>

    <div class="compare" id="compare">
      <img id="resultImg">
      <img id="beforeImg" class="topImg">
      <div class="divider" id="divider"></div>
      <span class="tag l" data-i18n="before"></span>
      <span class="tag r" data-i18n="after"></span>
      <input type="range" id="compareSlider" min="0" max="100" value="50">
    </div>
    <div class="btnRow" id="resultBtns" style="display:none;">
      <button class="btn primary" id="downloadBtn" data-i18n="download"></button>
    </div>
  </section>
</main>
<footer>HairAR Studio · Salon Virtual Try-On</footer>
<div style="position:fixed;right:10px;bottom:10px;z-index:99;font-size:11px;font-weight:700;
  color:var(--accent2);background:rgba(13,11,16,.8);border:1px solid var(--border);
  border-radius:8px;padding:3px 8px;pointer-events:none;">V4</div>

/* ============================================================
   Camera + MediaPipe hair segmentation (live recolor)
============================================================ */
const video = document.getElementById("video");
const liveCanvas = document.getElementById("liveCanvas");
const liveCtx = liveCanvas.getContext("2d");
const procCanvas = document.createElement("canvas");
const procCtx = procCanvas.getContext("2d", { willReadFrequently:true });
const aiPrevCanvas = document.getElementById("aiPreviewCanvas");
const aiPrevCtx = aiPrevCanvas.getContext("2d");
let segmenter = null, lastTs = -1;

async function init(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:"user", width:{ideal:960}, height:{ideal:1280} }, audio:false });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    await video.play();
    if (activeTab === "d3") d3Init();
  } catch(e){
    document.getElementById("liveMsg").innerHTML = `<div>⚠️</div><div>${t("cameraError")}</div>`;
    return;
  }
  const PROC_W = 420;
  procCanvas.width = PROC_W;
  procCanvas.height = Math.round(PROC_W * video.videoHeight / video.videoWidth);
  liveCanvas.width = procCanvas.width; liveCanvas.height = procCanvas.height;
  aiPrevCanvas.width = procCanvas.width; aiPrevCanvas.height = procCanvas.height;

  try {
    const { FilesetResolver, ImageSegmenter } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    segmenter = await ImageSegmenter.createFromOptions(fileset, {
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/latest/hair_segmenter.tflite",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      outputConfidenceMasks:true
    });
    document.getElementById("liveMsg").style.display = "none";
  } catch(e){
    document.getElementById("liveMsg").innerHTML = `<div>⚠️</div><div>AI model load failed: ${e.message}</div>`;
  }
  requestAnimationFrame(loop);
}

function loop(){
  if (video.readyState >= 2){
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
    if (activeTab === "live" && segmenter){
      let ts = performance.now();
      if (ts <= lastTs) ts = lastTs + 1;
      lastTs = ts;
      segmenter.segmentForVideo(procCanvas, ts, res => {
        const mask = res.confidenceMasks[0];
        const conf = mask.getAsFloat32Array();
        recolor(conf);
        mask.close();
      });
    } else if (activeTab === "live"){
      drawMirrored(liveCtx, procCanvas);
    }
    if (activeTab === "ai" && !photoDataUrl){
      drawMirrored(aiPrevCtx, procCanvas);
    }
  }
  if (activeTab === "d3") d3Frame();
  requestAnimationFrame(loop);
}

function recolor(conf){
  const w = procCanvas.width, h = procCanvas.height;
  const img = procCtx.getImageData(0, 0, w, h);
  const d = img.data;
  const strength = document.getElementById("strength").value / 100;
  const bright = document.getElementById("brightness").value / 100;
  const [cr, cg, cb] = liveColor;
  for (let i = 0, p = 0; i < conf.length; i++, p += 4){
    const c = conf[i];
    if (c < 0.08) continue;
    const r = d[p], g = d[p+1], b = d[p+2];
    let lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    lum = Math.min(1, lum * bright * 2.0);
    const tr = Math.min(255, cr * lum * 1.6);
    const tg = Math.min(255, cg * lum * 1.6);
    const tb = Math.min(255, cb * lum * 1.6);
    const a = Math.min(1, c * 1.15) * strength;
    d[p]   = r + (tr - r) * a;
    d[p+1] = g + (tg - g) * a;
    d[p+2] = b + (tb - b) * a;
  }
  procCtx.putImageData(img, 0, 0);
  drawMirrored(liveCtx, procCanvas);
}

function drawMirrored(ctx, src){
  ctx.save();
  ctx.setTransform(-1, 0, 0, 1, ctx.canvas.width, 0);
  ctx.drawImage(src, 0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.restore();
}

    im.onload = () => {

genBtn.onclick = async () => {
  aiErr.style.display = "none";
  if (!photoDataUrl || !selStyle){ showErr(t("needPhotoStyle")); return; }
  const key = (localStorage.getItem("hairar_gemini_key") || keyInput.value).trim();
  if (!key){ showErr(t("needKey")); return; }

  const msg = document.getElementById("aiMsg");
  document.getElementById("aiMsgText").textContent = t("generating");
  msg.style.display = "flex"; genBtn.disabled = true;

  const colorClause = selAiColor.p ? ` Dye the hair ${selAiColor.p} color.` : " Keep the original hair color.";
  const prompt = `Edit this photo: change the person's hairstyle to ${selStyle.p}.${colorClause} ` +
    `Keep the face, facial features, skin tone, identity, expression, clothing, lighting and background exactly the same. ` +
    `The result must be photorealistic with natural, detailed hair texture, like a professional salon photo.`;

  try {
    const b64 = photoDataUrl.split(",")[1];
    const resp = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json", "x-goog-api-key": key },
        body: JSON.stringify({
          contents:[{ parts:[
            { inlineData:{ mimeType:"image/jpeg", data:b64 } },
            { text: prompt }
          ]}]
        })
      });
    if (!resp.ok){
      const e = await resp.json().catch(()=>({}));
      throw new Error(e.error?.message || ("HTTP " + resp.status));
    }
    const data = await resp.json();
    const parts = data.candidates?.[0]?.content?.parts || [];
    const imgPart = parts.find(p => p.inlineData?.data);
    if (!imgPart) throw new Error(parts.find(p=>p.text)?.text || "No image returned");
    resultDataUrl = "data:image/png;base64," + imgPart.inlineData.data;
    showResult();
  } catch(e){
    showErr(t("errGen") + e.message);
  } finally {
    msg.style.display = "none"; genBtn.disabled = false; updateGenBtn();
  }
};

function showErr(m){ aiErr.textContent = m; aiErr.style.display = "block"; }

function showResult(){
  document.getElementById("resultImg").src = resultDataUrl;
  document.getElementById("beforeImg").src = photoDataUrl;
  compare.style.display = "block";
  document.getElementById("resultBtns").style.display = "flex";
  const slider = document.getElementById("compareSlider");
  slider.value = 50; updateCompare(50);
  slider.oninput = () => updateCompare(slider.value);
  compare.scrollIntoView({ behavior:"smooth", block:"center" });
}
function updateCompare(v){
  document.getElementById("beforeImg").style.clipPath = `inset(0 ${100-v}% 0 0)`;
  document.getElementById("divider").style.left = v + "%";
}
document.getElementById("downloadBtn").onclick = () => {
  const a = document.createElement("a");
  a.download = "hairar-style.png"; a.href = resultDataUrl; a.click();
};

/* ============================================================
   Realtime AR hairstyle (Decart Lucy 2.1, WebSocket + WebRTC)
============================================================ */
const rtRemote = document.getElementById("rtRemote"), rtLocal = document.getElementById("rtLocal");
const rtConnectBtn = document.getElementById("rtConnectBtn"), rtDisconnectBtn = document.getElementById("rtDisconnectBtn");
const rtKeyInput = document.getElementById("rtApiKey"), rtErrEl = document.getElementById("rtErr");
const rtMsg = document.getElementById("rtMsg"), rtMsgText = document.getElementById("rtMsgText");
const rtDot = document.getElementById("rtDot"), rtStatusEl = document.getElementById("rtStatus");
let rtClient = null, rtStream = null, rtRefBlob = null, rtSdk = null;
let rtModelId = "lucy-2.1";

const rtMode21Btn = document.getElementById("rtMode21Btn"), rtModeVtonBtn = document.getElementById("rtModeVtonBtn");
function rtSetMode(id){
  if (rtModelId === id) return;
  rtModelId = id;
  rtMode21Btn.classList.toggle("on", id === "lucy-2.1");
  rtModeVtonBtn.classList.toggle("on", id === "lucy-vton-3");
  if (rtClient) rtTeardown();   /* model change requires reconnect */
}
rtMode21Btn.onclick = () => rtSetMode("lucy-2.1");
rtModeVtonBtn.onclick = () => rtSetMode("lucy-vton-3");
const rtRefBtn = document.getElementById("rtRefBtn"), rtRefInput = document.getElementById("rtRefInput");
const rtRefThumb = document.getElementById("rtRefThumb"), rtRefClearBtn = document.getElementById("rtRefClearBtn");

rtKeyInput.value = localStorage.getItem("hairar_decart_key") || "";
document.getElementById("rtSaveKeyBtn").onclick = () => {
  localStorage.setItem("hairar_decart_key", rtKeyInput.value.trim());
  const ok = document.getElementById("rtKeySaved");
  ok.style.display = "block"; setTimeout(()=> ok.style.display = "none", 2000);
};

function rtSetStatus(key, color){
  rtStatusEl.textContent = t(key); rtDot.style.background = color;
}
function rtShowErr(m){ rtErrEl.textContent = m; rtErrEl.style.display = "block"; }

const RT_NEG = " Only change the hair — everything else must remain identical. " +
  "Do not add any animal ears, animal features, masks, hats or objects. " +
  "Keep the person's face, facial features, identity, skin, expression, clothing and background exactly the same.";

function rtBuildState(){
  const colorClause = selRtColor.p ? ` and dye the hair ${selRtColor.p} color` : "";

  /* ---- VTON 3: hair treated as a "wig product" — identity preserved ---- */
  if (rtModelId === "lucy-vton-3"){
    if (rtRefBlob){
      return {
        prompt: `Substitute the person's current hair with the wig shown in the reference image, ` +
          `covering the existing hair completely${colorClause}. Photorealistic natural hair texture.`,
        image: rtRefBlob, enhance: false
      };
    }
    if (selRtStyle){
      return {
        prompt: `Substitute the person's current hair with a wig styled as ${selRtStyle.p}` +
          `${colorClause}, covering the existing hair completely. Photorealistic natural hair texture.`,
        enhance: false
      };
    }
    if (selRtColor.p){
      return {
        prompt: `Substitute the person's current hair with a wig of the same style in ${selRtColor.p} color. ` +
          `Photorealistic natural hair texture.`,
        enhance: false
      };
    }
    return null;
  }

  /* ---- Lucy 2.1 ---- */
  if (rtRefBlob){
    /* transform mode: Lucy 2.1 character reference (whole-appearance change) */
    return {
      prompt: `Transform into the person in the reference image${colorClause}. Photorealistic.`,
      image: rtRefBlob, enhance: true
    };
  }
  if (selRtStyle){
    /* preset style → text-only prompt (hair-only edit).
       NOTE: Lucy 2.1 image reference = character transformation (it would swap
       the whole face/identity), so preset photos are UI-only and NOT sent. */
    return {
      prompt: `Change only the person's hairstyle to ${selRtStyle.p}${colorClause}. ` +
        `Photorealistic, natural detailed hair texture.` + RT_NEG,
      enhance: false
    };
  }
  if (selRtColor.p){
    return { prompt: `Dye the person's hair ${selRtColor.p} color. Photorealistic.` + RT_NEG, enhance: false };
  }
  return null;
}

async function rtSendPrompt(){
  if (!rtClient) return;
  const state = rtBuildState();
  if (!state) return;
  try {
    await rtClient.set(state);
  } catch(e){ rtShowErr(e.message || String(e)); }
}

/* --- hairstyle reference image --- */
rtRefBtn.onclick = () => rtRefInput.click();
rtRefInput.onchange = () => {
  const f = rtRefInput.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => {
    const max = 1024, sc = Math.min(1, max / Math.max(im.width, im.height));
    const c = document.createElement("canvas");
    c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    c.toBlob(b => {
      rtRefBlob = b;
      rtRefThumb.src = c.toDataURL("image/jpeg", 0.85);
      rtRefThumb.style.display = ""; rtRefClearBtn.style.display = "";
      selRtStyle = null; renderRtStyles();
      rtSendPrompt();
    }, "image/jpeg", 0.9);
    URL.revokeObjectURL(im.src);
  };
  im.src = URL.createObjectURL(f);
  rtRefInput.value = "";
};
function rtClearRef(silent){
  rtRefBlob = null;
  rtRefThumb.style.display = "none"; rtRefClearBtn.style.display = "none";
  if (!silent) rtSendPrompt();
}
rtRefClearBtn.onclick = () => rtClearRef(false);

rtConnectBtn.onclick = async () => {
  rtErrEl.style.display = "none";
  const key = (localStorage.getItem("hairar_decart_key") || rtKeyInput.value).trim();
  if (!key){ rtShowErr(t("rtNeedKey")); return; }
  rtConnectBtn.disabled = true;
  rtSetStatus("rtConnecting", "#e0b85c");
  rtMsgText.textContent = t("rtConnecting"); rtMsg.style.display = "flex";

  try {
    if (!rtSdk) rtSdk = await import("https://esm.sh/@decartai/sdk");
    const { createDecartClient, models } = rtSdk;
    const model = models.realtime(rtModelId);

    const num = (v, d) => (typeof v === "number" && isFinite(v) && v > 0) ? v : d;
    rtStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode:"user",
        width:{ ideal: num(model && model.width, 1280) },
        height:{ ideal: num(model && model.height, 704) },
        frameRate:{ ideal: num(model && model.fps, 25) }
      }
    });
    rtLocal.srcObject = rtStream;

    const client = createDecartClient({ apiKey: key });
    rtClient = await client.realtime.connect(rtStream, {
      model,
      onRemoteStream: s => {
        rtRemote.srcObject = s;
        rtMsg.style.display = "none";
        rtSetStatus("rtConnected", "#5cc98a");
        rtConnectBtn.style.display = "none"; rtDisconnectBtn.style.display = "";
        rtSendPrompt();
      },
      initialState: {
        prompt: { text: (rtBuildState() || {}).prompt || "Keep the video unchanged and photorealistic", enhance: false }
      }
    });
    rtClient.on("connectionChange", st => { if (st === "disconnected") rtTeardown(); });
    rtClient.on("error", err => rtShowErr(err.message || String(err)));
  } catch(e){
    rtShowErr(e.message || String(e)); rtTeardown();
  }
};

function rtTeardown(){
  if (rtClient){ try{ rtClient.disconnect(); }catch(e){} rtClient = null; }
  if (rtStream){ rtStream.getTracks().forEach(tr => tr.stop()); rtStream = null; }
  rtRemote.srcObject = null; rtLocal.srcObject = null;
  rtConnectBtn.disabled = false;
  rtConnectBtn.style.display = ""; rtDisconnectBtn.style.display = "none";
  rtSetStatus("rtDisconnected", "#666");
  rtMsgText.textContent = t("rtIdle"); rtMsg.style.display = "flex";
}
rtDisconnectBtn.onclick = rtTeardown;
window.addEventListener("beforeunload", rtTeardown);

/* ============================================================
   3D AR hairstyle (MediaPipe FaceLandmarker + Three.js) — V3
============================================================ */
const d3Video = document.getElementById("d3Video");
const d3Canvas = document.getElementById("d3Canvas");
const d3Msg = document.getElementById("d3Msg"), d3MsgText = document.getElementById("d3MsgText");
let d3Ready = false, d3Initing = false, d3Landmarker = null, d3Loader = null;
let T = null, d3Renderer = null, d3Scene = null, d3Camera = null;
let d3HeadGroup = null, d3HairGroup = null, d3CustomRoot = null;
let d3LastTs = -1, d3Tint = null, d3StyleId = "crop";
const D3_ANCHOR = { x:0, y:3.0, z:-3.0 };   /* hair anchor in canonical head space (cm) */
const D3_DEFAULT_COLOR = 0x2a1b10;
const D3_STYLES = [ {id:"crop", i18n:"d3sCrop", ic:"💇"}, {id:"bob", i18n:"d3sBob", ic:"💁"} ];

async function d3Init(){
  if (d3Ready || d3Initing) return;
  if (!video.srcObject) return;          /* camera not up yet; init() will call us */
  d3Initing = true;
  d3Msg.style.display = "flex";
  try {
    d3Video.srcObject = video.srcObject;
    await d3Video.play().catch(()=>{});
    T = await import("three");
    const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
    d3Loader = new GLTFLoader();
    const { FilesetResolver, FaceLandmarker } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14");
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    d3Landmarker = await FaceLandmarker.createFromOptions(fs, {
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO", numFaces:1, outputFacialTransformationMatrixes:true
    });

    const vw = video.videoWidth || 960, vh = video.videoHeight || 1280;
    document.getElementById("d3Stage").style.aspectRatio = vw + " / " + vh;
    d3Renderer = new T.WebGLRenderer({ canvas:d3Canvas, alpha:true, antialias:true });
    d3Renderer.setSize(vw, vh, false);
    d3Scene = new T.Scene();
    d3Camera = new T.PerspectiveCamera(63, vw/vh, 1, 10000);
    d3Scene.add(new T.HemisphereLight(0xffffff, 0x665544, 1.2));
    const dl = new T.DirectionalLight(0xffffff, 1.0);
    dl.position.set(0.3, 1, 1); d3Scene.add(dl);

    d3HeadGroup = new T.Group();
    d3HeadGroup.matrixAutoUpdate = false;
    d3Scene.add(d3HeadGroup);

    /* invisible head occluder: hides hair behind the head */
    const occ = new T.Mesh(new T.SphereGeometry(7.3, 32, 24),
      new T.MeshBasicMaterial({ colorWrite:false }));
    occ.scale.set(1.0, 1.3, 1.15);
    occ.position.set(0, 2.0, -3.0);
    occ.renderOrder = -1;
    d3HeadGroup.add(occ);

    d3HairGroup = new T.Group();
    d3HeadGroup.add(d3HairGroup);
    d3BuildStyle();
    d3ApplyFit();

    d3Ready = true;
    d3Msg.style.display = "none";
  } catch(e){
    d3MsgText.textContent = "3D init failed: " + (e.message || e);
  } finally { d3Initing = false; }
}

function d3HairColor(){ return d3Tint === null ? D3_DEFAULT_COLOR : d3Tint; }

function d3ClearHair(){
  while (d3HairGroup.children.length){
    const c = d3HairGroup.children.pop();
    if (c.traverse) c.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  }
  d3CustomRoot = null;
}

/* one curved strand tube growing out of the scalp */
function d3Strand(origin, normal, len, sag, rad, mat){
  const down = new T.Vector3(0,-1,0);
  const p0 = origin.clone();
  const p1 = origin.clone().addScaledVector(normal, len*0.45).addScaledVector(down, len*sag*0.35);
  const p2 = origin.clone().addScaledVector(normal, len*0.8).addScaledVector(down, len*sag);
  const curve = new T.CatmullRomCurve3([p0, p1, p2]);
  return new T.Mesh(new T.TubeGeometry(curve, 6, rad, 4, false), mat);
}

function d3BuildStyle(){
  d3ClearHair();
  if (d3StyleId === "custom") return;
  const mat = new T.MeshStandardMaterial({ color:d3HairColor(), roughness:0.55, metalness:0.05 });
  const C = new T.Vector3(D3_ANCHOR.x, D3_ANCHOR.y, D3_ANCHOR.z);
  const R = 7.5;
  const isBob = d3StyleId === "bob";

  const cap = new T.Mesh(
    new T.SphereGeometry(R + 0.35, 48, 32, 0, Math.PI*2, 0, isBob ? Math.PI*0.62 : Math.PI*0.55), mat);
  cap.scale.set(1.02, 1.18, 1.1);
  cap.position.copy(C);
  d3HairGroup.add(cap);

  const count = isBob ? 240 : 170;
  for (let i = 0; i < count; i++){
    const u = Math.random()*Math.PI*2;
    const v = Math.random()*(isBob ? 0.62 : 0.5)*Math.PI;
    const n = new T.Vector3(Math.sin(v)*Math.cos(u), Math.cos(v), Math.sin(v)*Math.sin(u));
    n.multiply(new T.Vector3(1.02, 1.18, 1.1)).normalize();
    const origin = C.clone().addScaledVector(n, R + 0.3);
    const front = n.z > 0.55;
    let len = isBob ? 9 + Math.random()*4 : 2 + Math.random()*1.6;
    if (front) len = Math.min(len, isBob ? 4.5 : 2.2);
    d3HairGroup.add(d3Strand(origin, n, len, isBob ? 0.85 : 0.35, isBob ? 0.22 : 0.14, mat));
  }
}

function d3SetTint(v){
  d3Tint = v;
  if (d3CustomRoot){
    d3CustomRoot.traverse(o => {
      if (o.isMesh && o.material && o.material.color){
        if (o.userData.origColor === undefined) o.userData.origColor = o.material.color.getHex();
        o.material.color.setHex(d3Tint === null ? o.userData.origColor : d3Tint);
      }
    });
  } else if (d3Ready) d3BuildStyle();
}

function d3ApplyFit(){
  if (!d3HairGroup) return;
  d3HairGroup.scale.setScalar(document.getElementById("d3Scale").value / 100);
  d3HairGroup.position.set(0,
    document.getElementById("d3OffY").value / 10,
    document.getElementById("d3OffZ").value / 10);
}
["d3Scale","d3OffY","d3OffZ"].forEach(id => document.getElementById(id).oninput = d3ApplyFit);

function d3RenderStyleCards(){
  const g = document.getElementById("d3StyleGrid"); g.innerHTML = "";
  D3_STYLES.forEach(s => {
    const c = document.createElement("div");
    c.className = "styleCard" + (d3StyleId === s.id ? " on" : "");
    c.innerHTML = `<div style="font-size:30px;padding:18px 0;">${s.ic}</div><div class="nm">${t(s.i18n)}</div>`;
    c.onclick = () => {
      d3StyleId = s.id;
      if (d3Ready){ d3BuildStyle(); }
      d3RenderStyleCards();
    };
    g.appendChild(c);
  });
}
function d3RenderSwatches(){
  const w = document.getElementById("d3Swatches"); w.innerHTML = "";
  const none = document.createElement("div");
  none.className = "sw none" + (d3Tint === null ? " on" : "");
  none.textContent = "Ø";
  none.onclick = () => { d3SetTint(null); d3RenderSwatches(); };
  w.appendChild(none);
  LIVE_COLORS.forEach(hex => {
    const hx = parseInt(hex.slice(1), 16);
    const d = document.createElement("div");
    d.className = "sw" + (d3Tint === hx ? " on" : "");
    d.style.background = hex;
    d.onclick = () => { d3SetTint(hx); d3RenderSwatches(); };
    w.appendChild(d);
  });
}

document.getElementById("d3LoadBtn").onclick = () => document.getElementById("d3File").click();
document.getElementById("d3File").onchange = async e => {
  const f = e.target.files[0];
  if (!f || !d3Ready){ e.target.value = ""; return; }
  const buf = await f.arrayBuffer();
  d3Loader.parse(buf, "", gltf => {
    d3ClearHair();
    d3StyleId = "custom";
    const root = gltf.scene;
    const box = new T.Box3().setFromObject(root);
    const size = new T.Vector3(); box.getSize(size);
    const ctr = new T.Vector3(); box.getCenter(ctr);
    const s = 17 / Math.max(size.x, 0.001);     /* auto-fit: head width ≈ 17cm */
    root.scale.setScalar(s);
    root.position.set(D3_ANCHOR.x - ctr.x*s, D3_ANCHOR.y - ctr.y*s, D3_ANCHOR.z - ctr.z*s);
    d3HairGroup.add(root);
    d3CustomRoot = root;
    if (d3Tint !== null) d3SetTint(d3Tint);
    d3RenderStyleCards();
  }, () => {
    d3MsgText.textContent = "glTF load failed";
    d3Msg.style.display = "flex";
    setTimeout(() => { if (d3Ready) d3Msg.style.display = "none"; }, 2500);
  });
  e.target.value = "";
};

function d3Frame(){
  if (!(d3Ready && d3Video.readyState >= 2)) return;
  let ts = performance.now();
  if (ts <= d3LastTs) ts = d3LastTs + 1;
  d3LastTs = ts;
  const res = d3Landmarker.detectForVideo(d3Video, ts);
  const fm = res && res.facialTransformationMatrixes;
  if (fm && fm.length){
    d3HeadGroup.visible = true;
    d3HeadGroup.matrix.fromArray(fm[0].data);
  } else {
    d3HeadGroup.visible = false;
  }
  d3Renderer.render(d3Scene, d3Camera);
}

/* ============================================================
   utils + boot
============================================================ */
function hexToRgb(hex){
  const n = parseInt(hex.slice(1), 16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
applyLang();
init();
</script>
